name: Ship

# THIN caller into Ship's reusable workflows -- all real logic lives in
# KarotkiDzianis/shipClaudeDeploy's own .github/workflows/. Pinned to an
# immutable commit SHA -- bump deliberately whenever platform/ship
# changes and this project should pick it up, never track a branch.
#
# TEMPORARY (2026-09-18): registry/projects.yml flips ship-sandbox's
# approval to `telegram` (was `automatic`) to prove the real approval
# daemon + button tap end to end, now that it's running on the VM -- so
# this workflow temporarily goes through the full ci -> release -> deploy
# chain like a real project would, instead of skipping straight to
# deploy. Revert both once confirmed working.

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: KarotkiDzianis/shipClaudeDeploy/.github/workflows/reusable-ci.yml@3aac875d40fc3b7463e24887e2f6984e7a02643e
    with:
      project_slug: ship-sandbox

  release:
    needs: ci
    uses: KarotkiDzianis/shipClaudeDeploy/.github/workflows/reusable-release.yml@3aac875d40fc3b7463e24887e2f6984e7a02643e
    with:
      project_slug: ship-sandbox
      git_sha: ${{ needs.ci.outputs.git_sha }}
      artifact_sha256: ${{ needs.ci.outputs.artifact_sha256 }}
      change_summary: "prove the real Telegram approval daemon end to end"

  deploy:
    needs: [ci, release]
    uses: KarotkiDzianis/shipClaudeDeploy/.github/workflows/reusable-deploy.yml@3aac875d40fc3b7463e24887e2f6984e7a02643e
    with:
      project_slug: ship-sandbox
      git_sha: ${{ needs.ci.outputs.git_sha }}
      artifact_sha256: ${{ needs.ci.outputs.artifact_sha256 }}
      release_id: ${{ needs.ci.outputs.git_sha }}
